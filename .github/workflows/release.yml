# Build the .deb and publish a GitHub release for the VERSION in folio.py.
# Runs when folio.py changes on main (or by hand from the Actions tab). If a release for that
# version already exists nothing happens, so bump VERSION to publish. The tag vX.Y.Z is created by the release.
name: Release

on:
  push:
    branches: [main]
    paths: ["folio.py", "requirements.txt", "packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' folio.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists – nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: System packages
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libxcb-cursor0 libegl1 libxkbcommon-x11-0

      - name: Build .deb
        if: steps.ver.outputs.skip != 'true'
        run: bash packaging/build-deb.sh

      - name: Smoke test
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get install -y ./dist/Folio_*_amd64.deb
          QT_QPA_PLATFORM=offscreen timeout 10 folio || [ $? -eq 124 ]

      - name: Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Folio ${{ steps.ver.outputs.version }}
          files: dist/*.deb
          body: |
            **Install:** download `Folio_${{ steps.ver.outputs.version }}_amd64.deb` below, then
            ```bash
            cd ~/Downloads
            sudo apt install ./Folio_${{ steps.ver.outputs.version }}_amd64.deb
            ```
            What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
